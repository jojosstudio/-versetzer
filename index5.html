<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neue Siri Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
    /* Vollbild-Overlay mit animiertem Farbverlauf */
    .siri-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(120deg, #0072ff, #00c6ff, #8a2be2, #ff00ff);
      background-size: 200% 200%;
      animation: moveGradient 5s linear infinite;
      /* Maske, die den zentralen Bereich freilässt */
      -webkit-mask-image: radial-gradient(circle at center, transparent 25%, black 40%);
      mask-image: radial-gradient(circle at center, transparent 25%, black 40%);
      z-index: 100;
    }
    @keyframes moveGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Fade-Out-Effekt, um das Overlay nach einer Weile auszublenden */
    .fade-out {
      animation: fadeOut 1s forwards;
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Siri Animation Overlay -->
  <div class="siri-animation" id="siriAnimation"></div>

  <script>
    window.onload = function() {
      // Nach 5 Sekunden wird die Siri Animation ausgeblendet
      setTimeout(function() {
         var siri = document.getElementById('siriAnimation');
         siri.classList.add('fade-out');
         // Optional: Entferne das Element nach dem Fade-Out
         setTimeout(function() {
           siri.style.display = 'none';
         }, 1000);
      }, 5000);
    };
  </script>
</body>
</html>
