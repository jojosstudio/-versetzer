<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Siri Animation</title>
  <style>
    /* Grundlayout */
    body {
      margin: 0;
      padding: 0;
      background-color: #f0f0f5;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    /* Container für die Animation */
    #siri-animation {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 20px;
    }
    /* Stil und Animation der Kreise */
    .siri-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      margin: -25px; /* zentriert den Kreis */
      border: 2px solid #007AFF; /* Apple-Blau */
      border-radius: 50%;
      opacity: 0;
      animation: pulse 2s infinite;
    }
    /* Gestaffelte Animationen für einen fließenden Effekt */
    .siri-circle:nth-child(1) {
      animation-delay: 0s;
    }
    .siri-circle:nth-child(2) {
      animation-delay: 0.5s;
    }
    .siri-circle:nth-child(3) {
      animation-delay: 1s;
    }
    @keyframes pulse {
      0% {
        transform: scale(0.5);
        opacity: 0.8;
      }
      50% {
        opacity: 0.4;
      }
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }
    /* Überschrift */
    h1 {
      font-size: 2em;
      margin: 10px 0;
      color: #333;
    }
    /* Buttons */
    .buttons {
      margin-top: 20px;
    }
    .buttons button {
      background-color: #007AFF;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 1em;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .buttons button:hover {
      background-color: #005BB5;
    }
  </style>
</head>
<body>
  <!-- Siri-Animation -->
  <div id="siri-animation">
    <div class="siri-circle"></div>
    <div class="siri-circle"></div>
    <div class="siri-circle"></div>
  </div>

  <!-- Begrüßung -->
  <h1>Hallo</h1>

  <!-- Navigation -->
  <div class="buttons">
    <button onclick="window.location.href='page1.html'">Seite 1</button>
    <button onclick="window.location.href='page2.html'">Seite 2</button>
    <button onclick="window.location.href='page3.html'">Seite 3</button>
  </div>
</body>
</html>
