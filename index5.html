<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siri Fluid Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      position: relative;
    }
    /* Fluid-Effekt im Siri-Stil, der vom linken Rand hereingleitet */
    .siri-fluid {
      position: absolute;
      top: 0;
      left: 0;
      width: 50vw;
      height: 100vh;
      background: linear-gradient(135deg, #00c6ff, #0072ff, #8a2be2);
      filter: blur(30px);
      opacity: 0.8;
      /* Start als schmaler Streifen und dann ein fluides, organisches Wachstum */
      clip-path: polygon(0 0, 0 100%, 0 100%, 0 0);
      animation: fluidEffect 3s ease-out forwards;
    }
    @keyframes fluidEffect {
      0% {
        clip-path: polygon(0 0, 0 100%, 0 100%, 0 0);
      }
      50% {
        clip-path: polygon(0 0, 60% 0, 50% 100%, 0 100%);
      }
      100% {
        clip-path: polygon(0 0, 70% 0, 60% 100%, 0 100%);
      }
    }
    /* Content über dem Fluid-Effekt */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
    }
    /* "Hallo" erscheint nach der Fluid-Animation */
    .hello {
      font-size: 2em;
      opacity: 0;
      animation: fadeIn 1s ease-in forwards;
      animation-delay: 3.2s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    /* Buttons werden einzeln animiert */
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    .button-container button {
      padding: 10px 20px;
      font-size: 1em;
      background: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.5s forwards;
    }
    .button-container button:nth-child(1) {
      animation-delay: 5.5s;
    }
    .button-container button:nth-child(2) {
      animation-delay: 5.7s;
    }
    .button-container button:nth-child(3) {
      animation-delay: 5.9s;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="siri-fluid"></div>
  <div class="content">
    <div class="hello">Hallo</div>
    <div class="button-container">
      <button>Button 1</button>
      <button>Button 2</button>
      <button>Button 3</button>
    </div>
  </div>
</body>
</html>
