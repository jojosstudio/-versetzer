<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Fluid Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* Fluid-Effekt, der von der linken Seite ins Bild kommt */
    .fluid-animation {
      position: absolute;
      top: 0;
      left: -50%;
      width: 150%;
      height: 100%;
      background: linear-gradient(120deg, #0072ff, #00c6ff, #8a2be2, #ff00ff);
      filter: blur(50px);
      animation: fluidMove 3s ease-out forwards, fluidWave 5s infinite alternate ease-in-out;
    }

    /* Animation, um die Welle langsam schwingen zu lassen */
    @keyframes fluidMove {
      from {
        left: -50%;
      }
      to {
        left: 0;
      }
    }

    @keyframes fluidWave {
      from {
        transform: skewX(5deg) translateY(-10px);
      }
      to {
        transform: skewX(-5deg) translateY(10px);
      }
    }

    /* Der eigentliche Content */
    .content {
      position: absolute;
      z-index: 2;
      text-align: center;
      color: white;
    }

    /* "Hallo" erscheint nach der Fluid-Animation */
    .hello {
      font-size: 3em;
      font-weight: bold;
      opacity: 0;
      animation: fadeIn 1s ease-in forwards;
      animation-delay: 3.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Button-Container */
    .button-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      opacity: 0;
      animation: fadeIn 1s ease-in forwards;
      animation-delay: 3.5s;
    }

    /* Styling der Buttons */
    .button-container button {
      padding: 12px 25px;
      font-size: 1.2em;
      font-weight: bold;
      background: white;
      border: none;
      cursor: pointer;
      border-radius: 30px;
      transition: 0.3s;
    }

    .button-container button:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

  <!-- Die fließende Animation von der linken Seite -->
  <div class="fluid-animation"></div>

  <!-- Der eigentliche Inhalt -->
  <div class="content">
    <div class="hello">Hallo</div>
    <div class="button-container">
      <button>Button 1</button>
      <button>Button 2</button>
      <button>Button 3</button>
    </div>
  </div>

</body>
</html>
