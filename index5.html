<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Intelligent Animation</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        /* Die neue Apple-Intelligent-Animation, die sich über den Rand hinaus ausbreitet */
        .apple-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            opacity: 1;
            animation: appleIntelligent 2s ease-in-out forwards;
            z-index: 1;
        }
        @keyframes appleIntelligent {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(20);
                opacity: 0;
            }
        }
        /* "Hallo" erscheint nach der Animation */
        .hello {
            font-size: 2em;
            color: white;
            opacity: 0;
            z-index: 2;
            animation: fadeIn 1s ease-in-out forwards;
            animation-delay: 2.5s;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        /* Die Button-Gruppe wird nach "Hallo" eingeblendet */
        .button-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
            z-index: 2;
        }
        .button-container button {
            padding: 10px 20px;
            font-size: 1em;
            background: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .show-buttons {
            display: flex !important;
        }
    </style>
    <script>
        window.onload = function() {
            // "Hallo" erscheint nach 2.5 Sekunden
            setTimeout(() => {
                document.querySelector('.hello').style.display = 'block';
            }, 2500);
            // Nach 5 Sekunden verschwindet "Hallo" und die Buttons werden angezeigt
            setTimeout(() => {
                document.querySelector('.hello').style.display = 'none';
                document.querySelector('.button-container').classList.add('show-buttons');
            }, 5000);
        };
    </script>
</head>
<body>
    <div class="apple-animation"></div>
    <div class="hello">Hallo</div>
    <div class="button-container">
        <button>Button 1</button>
        <button>Button 2</button>
        <button>Button 3</button>
    </div>
</body>
</html>
