<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter-Seite</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #111; color: white; }
        #chatbox { display: none; margin-top: 20px; }
        #response { opacity: 0; transition: opacity 1s ease-in-out; }
    </style>
</head>
<body>
    <video id="introVideo" width="80%" autoplay muted>
        <source src="Animation - 1740403831364.mp4" type="video/mp4">
        Dein Browser unterstützt keine Videos.
    </video>
    
    <div id="chatbox">
        <p><strong>Du:</strong> Hallo</p>
        <p id="response"><strong>Siri:</strong> Dies ist die Seite für den Converter. Hier sind die drei Versionen:</p>
        <ul id="converterList" style="display: none;">
            <li>Version 1: Basis-Converter</li>
            <li>Version 2: Erweiterter Converter</li>
            <li>Version 3: Profi-Converter</li>
        </ul>
    </div>

    <script>
        document.getElementById("introVideo").onended = function() {
            document.getElementById("chatbox").style.display = "block";
            setTimeout(() => {
                document.getElementById("response").style.opacity = 1;
                setTimeout(() => {
                    document.getElementById("converterList").style.display = "block";
                }, 1000);
            }, 1000);
        };
    </script>
</body>
</html>
