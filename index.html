<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converter-Seite</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #111; color: white; }
        #container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #introVideo { width: 200px; height: auto; border-radius: 50%; }
        #chatbox { display: none; margin-top: 20px; width: 80%; max-width: 300px; text-align: left; }
        .speech-bubble { background: #333; padding: 10px; border-radius: 10px; margin: 5px; opacity: 0; transition: opacity 0.5s ease-in-out; }
        .typing { display: inline-block; width: 4px; height: 4px; background: white; border-radius: 50%; animation: blink 1.5s infinite; }
        .typing::after, .typing::before { content: ''; display: inline-block; width: 4px; height: 4px; background: white; border-radius: 50%; margin-left: 3px; animation: blink 1.5s infinite; }
        .typing::before { animation-delay: 0.2s; }
        .typing::after { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        #buttonContainer { display: none; margin-top: 20px; }
        button { background: #444; color: white; padding: 10px; border: none; border-radius: 5px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="container">
        <video id="introVideo" autoplay muted>
            <source src="Animation - 1740403831364.mp4" type="video/mp4">
            Dein Browser unterstützt keine Videos.
        </video>
        
        <div id="chatbox">
            <p id="message1" class="speech-bubble"><strong>Du:</strong> Hallo</p>
            <p id="typing" class="speech-bubble"><span class="typing"></span></p>
            <p id="response" class="speech-bubble"><strong>AI:</strong> Dies ist die Seite für den Converter. Wähle eine Version:</p>
        </div>
        
        <div id="buttonContainer">
            <button onclick="window.location.href='index1.html'">Legacy Converter</button>
            <button onclick="window.location.href='index2.html'">Converter</button>
            <button onclick="window.location.href='index3.html'">Beta Decoder</button>
        </div>
    </div>

    <script>
        document.getElementById("introVideo").onended = function() {
            document.getElementById("chatbox").style.display = "block";
            setTimeout(() => {
                document.getElementById("message1").style.opacity = 1;
                setTimeout(() => {
                    document.getElementById("typing").style.opacity = 1;
                    setTimeout(() => {
                        document.getElementById("typing").style.opacity = 0;
                        document.getElementById("response").style.opacity = 1;
                        setTimeout(() => {
                            document.getElementById("buttonContainer").style.display = "block";
                        }, 1000);
                    }, 1500);
                }, 1000);
            }, 1000);
        };
    </script>
</body>
</html>
